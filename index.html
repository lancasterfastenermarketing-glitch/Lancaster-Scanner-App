
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071957">
<title>Lancaster Fastener - Barcode Verification</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root {
  --navy: #071957;
  --navy2: #102b70;
  --page: #f3f5f9;
  --green: #08752a;
  --green-bg: #d9f8e2;
  --red: #b42318;
  --red-bg: #ffe0e0;
}

* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 12px;
  padding-top: max(12px, env(safe-area-inset-top));
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--page);
  color: #17202a;
}

main {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 22px 18px;
  background: white;
  border-radius: 18px;
  border-top: 6px solid var(--navy);
  text-align: center;
  box-shadow: 0 5px 24px #07195718;
}

.logo {
  display: block;
  width: 100px;
  max-height: 120px;
  object-fit: contain;
  margin: 0 auto 12px;
}

h1 {
  color: var(--navy);
  font-size: 27px;
  margin: 0 0 7px;
}

.subtitle {
  color: #667085;
  font-size: 14px;
  margin: 0 0 20px;
}

#instruction {
  color: var(--navy);
  font-weight: bold;
  font-size: 16px;
  line-height: 1.45;
}

.field-label {
  text-align: left;
  color: var(--navy);
  font-size: 13px;
  font-weight: bold;
  margin: 18px 0 7px;
}

.value {
  min-height: 52px;
  padding: 14px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-wrap: anywhere;
  word-break: break-word;
  font-size: 17px;
  line-height: 1.4;
  background: #f3f5f9;
  border: 1px solid #e1e6ef;
  border-radius: 10px;
}

button {
  display: block;
  width: 100%;
  min-height: 54px;
  padding: 15px 12px;
  margin-top: 12px;
  border: 0;
  border-radius: 11px;
  background: var(--navy);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active { transform: scale(.99); }
button:disabled { opacity: .55; cursor: not-allowed; }

button.secondary {
  color: var(--navy);
  background: white;
  border: 2px solid var(--navy);
}

#reader {
  display: none;
  width: 100%;
  margin: 14px auto;
  overflow: hidden;
  border-radius: 12px;
  background: #111;
}

#reader.active { display: block; }

#reader video {
  max-width: 100% !important;
  border-radius: 10px;
}

#result {
  margin-top: 18px;
  padding: 22px 10px;
  border-radius: 12px;
  font-size: clamp(26px, 7vw, 32px);
  font-weight: bold;
  overflow-wrap: anywhere;
}

.match { background: var(--green-bg); color: var(--green); }
.different { background: var(--red-bg); color: var(--red); }
.hidden { display: none !important; }

.hint {
  color: #667085;
  font-size: 13px;
  line-height: 1.5;
  margin: 14px 0 3px;
}

footer {
  margin-top: 20px;
  color: #98a2b3;
  font-size: 11px;
}

@media (max-width: 360px) {
  main { padding: 18px 13px; }
  .logo { width: 82px; }
  h1 { font-size: 24px; }
  .value { font-size: 15px; }
}
</style>
</head>

<body>
<main>

  <!-- KEEP YOUR ORIGINAL EMBEDDED LOGO IMG LINE HERE -->
  <!-- Copy the complete <img class="logo" ...> line from your original HTML. -->

  <h1>Lancaster Fastener</h1>
  <p class="subtitle">Barcode verification scanner</p>

  <p id="instruction" aria-live="polite">
    Press the button to scan the first barcode.
  </p>

  <div id="reader"></div>

  <button id="scan" type="button">Scan First Barcode</button>
  <button id="cancel" type="button" class="secondary hidden">
    Cancel Scan
  </button>

  <p class="field-label">BARCODE 1</p>
  <div class="value" id="first">Not scanned</div>

  <p class="field-label">BARCODE 2</p>
  <div class="value" id="second">Not scanned</div>

  <div id="result" class="hidden" role="status" aria-live="polite"></div>

  <p class="hint" id="hint">
    The camera remains off until you press the scan button.
  </p>

  <button id="again" type="button" class="secondary hidden">
    Start Over
  </button>

  <footer>Barcode Verification</footer>
</main>

<script>
const $ = id => document.getElementById(id);

let scanner = null;
let firstCode = null;
let secondCode = null;
let busy = false;
let sessionId = 0;

/*
 * IMPORTANT:
 * startScan() is called only by the Scan button.
 * There is no automatic camera startup on page load.
 */

async function stopScanner() {
  const activeScanner = scanner;
  scanner = null;

  if (activeScanner) {
    try {
      if (activeScanner.isScanning) {
        await activeScanner.stop();
      }
    } catch (error) {
      console.warn("Unable to stop scanner:", error);
    }

    try {
      activeScanner.clear();
    } catch (error) {
      console.warn("Scanner cleanup:", error);
    }
  }

  $("reader").classList.remove("active");
}

async function startScan() {
  if (busy || (firstCode !== null && secondCode !== null)) {
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    $("instruction").textContent =
      "Scanner library unavailable. Check your internet connection.";
    return;
  }

  busy = true;
  const thisSession = ++sessionId;
  const scanningFirst = firstCode === null;

  $("scan").disabled = true;
  $("cancel").classList.remove("hidden");
  $("instruction").textContent = scanningFirst
    ? "Starting camera for barcode 1..."
    : "Starting camera for barcode 2...";
  $("hint").textContent =
    "Position the entire barcode inside the camera view.";
  $("reader").classList.add("active");

  let activeScanner = null;

  try {
    activeScanner = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.QR_CODE
      ],
      verbose: false
    });

    scanner = activeScanner;

    await activeScanner.start(
      { facingMode: "environment" },
      {
        fps: 15,
        qrbox: (width, height) => ({
          width: Math.min(width, Math.max(
            160, Math.min(Math.floor(width * 0.92), 420)
          )),
          height: Math.min(height, Math.max(
            75, Math.min(Math.floor(height * 0.35), 180)
          ))
        }),
        disableFlip: false
      },

      async decodedText => {
        // Ignore duplicate callbacks or callbacks from cancelled scans.
        if (!busy || thisSession !== sessionId) return;

        // Lock immediately to accept only one barcode per button press.
        busy = false;
        $("instruction").textContent = "Barcode captured. Stopping camera...";
        $("scan").disabled = true;

        await stopScanner();

        if (thisSession !== sessionId) return;

        $("cancel").classList.add("hidden");

        if (scanningFirst) {
          firstCode = decodedText;
          $("first").textContent = firstCode;

          $("instruction").textContent =
            "First barcode captured. Press the button to scan barcode 2.";
          $("scan").textContent = "Scan Second Barcode";
          $("hint").textContent =
            "The camera is off. Press the button when ready for the second barcode.";
          $("scan").disabled = false;
          return;
        }

        secondCode = decodedText;
        $("second").textContent = secondCode;

        const same = firstCode === secondCode;

        $("result").textContent = same ? "✓ MATCH" : "✕ NO MATCH";
        $("result").className = same ? "match" : "different";

        $("instruction").textContent = "Comparison complete.";
        $("hint").textContent = same
          ? "Both barcode values are identical."
          : "The barcode values are different.";

        $("scan").classList.add("hidden");
        $("again").classList.remove("hidden");
      },

      () => {
        // No action on frames where no barcode is recognised.
      }
    );

    // The user may have cancelled while camera startup was pending.
    if (thisSession !== sessionId) {
      try {
        if (activeScanner.isScanning) await activeScanner.stop();
      } catch (error) {}
      try { activeScanner.clear(); } catch (error) {}
      return;
    }

    $("instruction").textContent = scanningFirst
      ? "Scanning barcode 1..."
      : "Scanning barcode 2...";
    $("hint").textContent =
      "Align the barcode and hold your phone steady. Scanning stops after capture.";

  } catch (error) {
    if (thisSession !== sessionId) return;

    await stopScanner();
    busy = false;

    $("cancel").classList.add("hidden");
    $("scan").disabled = false;
    $("instruction").textContent = "Unable to start the camera.";
    $("hint").textContent =
      "Allow camera access and open this page using HTTPS.";
    console.error(error);
  }
}

async function cancelScan() {
  if (!busy && !scanner) return;

  ++sessionId;
  busy = false;

  $("cancel").disabled = true;
  await stopScanner();
  $("cancel").disabled = false;
  $("cancel").classList.add("hidden");
  $("scan").disabled = false;

  $("instruction").textContent = "Scan cancelled.";
  $("hint").textContent =
    "Your captured barcode has been kept. Press Scan to continue.";
}

async function startOver() {
  ++sessionId;
  busy = false;

  await stopScanner();

  firstCode = null;
  secondCode = null;

  $("first").textContent = "Not scanned";
  $("second").textContent = "Not scanned";

  $("result").textContent = "";
  $("result").className = "hidden";

  $("instruction").textContent =
    "Press the button to scan the first barcode.";
  $("hint").textContent =
    "The camera remains off until you press the scan button.";

  $("scan").textContent = "Scan First Barcode";
  $("scan").classList.remove("hidden");
  $("scan").disabled = false;

  $("cancel").classList.add("hidden");
  $("again").classList.add("hidden");
}

// These are the ONLY buttons that start, cancel or reset scanning.
$("scan").addEventListener("click", startScan);
$("cancel").addEventListener("click", cancelScan);
$("again").addEventListener("click", startOver);

// Release the camera when the page is closed or navigated away from.
window.addEventListener("pagehide", () => {
  if (scanner && scanner.isScanning) {
    scanner.stop().catch(() => {});
  }
});
</script>
</body>
</html>
