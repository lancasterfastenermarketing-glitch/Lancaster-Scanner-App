
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071957">
<title>Lancaster Fastener - Barcode Verification</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root {
    --navy: #071957;
    --navy-light: #102b70;
    --blue: #1769aa;
    --green: #16803c;
    --red: #c62828;
    --grey: #f1f4f8;
    --text: #172033;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    background: var(--grey);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    max-width: 600px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 5px 22px rgba(0,0,0,0.12);
}

header {
    background: var(--navy);
    color: white;
    padding: 22px 16px;
    text-align: center;
}

header h1 {
    font-size: 25px;
    margin: 0;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

main {
    padding: 20px;
}

.step {
    border: 1px solid #dce2eb;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
}

.step h2 {
    font-size: 18px;
    margin: 0 0 12px;
    color: var(--navy);
}

.status {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 12px;
    color: #555;
}

.barcode-value {
    overflow-wrap: anywhere;
    min-height: 46px;
    background: #f5f7fa;
    border: 1px solid #e0e5ed;
    border-radius: 8px;
    padding: 12px;
    font-size: 16px;
    margin-bottom: 12px;
}

button {
    width: 100%;
    padding: 14px 12px;
    border: 0;
    border-radius: 9px;
    background: var(--blue);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
    touch-action: manipulation;
}

button:disabled {
    background: #a8b0bd;
    cursor: not-allowed;
}

button.secondary {
    background: var(--navy);
}

button.cancel {
    background: #606b7a;
}

/* Original camera preview sizing */
#reader {
    width: 100%;
    margin: 12px 0;
    overflow: hidden;
    border-radius: 8px;
}

#reader video {
    border-radius: 8px;
}

#result {
    display: none;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    margin-top: 16px;
    overflow-wrap: anywhere;
}

#result h2 {
    margin: 0 0 8px;
    font-size: 28px;
}

#result p {
    margin: 0;
    font-size: 15px;
}

.match {
    display: block !important;
    color: #155724;
    background: #d4edda;
    border: 2px solid #b7dfc0;
}

.no-match {
    display: block !important;
    color: #721c24;
    background: #f8d7da;
    border: 2px solid #f1bfc4;
}

#cameraStatus {
    font-size: 14px;
    text-align: center;
    color: #555;
    margin-top: 10px;
    line-height: 1.4;
}

footer {
    text-align: center;
    padding: 14px;
    font-size: 12px;
    color: #6b7280;
}

@media (max-width: 400px) {
    body {
        padding: 8px;
    }

    main {
        padding: 12px;
    }

    header h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <h1>Lancaster Fastener</h1>
        <p>Barcode Verification Scanner</p>
    </header>

    <main>

        <div class="step">
            <h2>1. First Barcode</h2>
            <div id="status1" class="status">Not scanned</div>
            <div id="barcode1" class="barcode-value">Waiting for first barcode</div>
            <button id="start1">Open Camera for Barcode 1</button>
        </div>

        <div class="step">
            <h2>2. Second Barcode</h2>
            <div id="status2" class="status">Not scanned</div>
            <div id="barcode2" class="barcode-value">Waiting for second barcode</div>
            <button id="start2" disabled>Open Camera for Barcode 2</button>
        </div>

        <div class="step">
            <h2>Camera Scanner</h2>

            <div id="cameraStatus" aria-live="polite">
                Open the camera, then press Capture Barcode when ready.
            </div>

            <div id="reader"></div>

            <button id="capture" disabled>Capture Barcode</button>
            <button id="cancel" class="cancel" disabled>Cancel Scan</button>
        </div>

        <div id="result" role="status" aria-live="polite">
            <h2 id="resultHeading"></h2>
            <p id="resultText"></p>
        </div>

        <button id="reset" class="secondary">Start Over</button>

    </main>

    <footer>
        Lancaster Fastener | Barcode Verification
    </footer>

</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let scanner = null;
let cameraRunning = false;
let scanEnabled = false;
let busy = false;
let activeBarcode = 0;
let barcode1Value = "";
let barcode2Value = "";

function setCameraStatus(message) {
    $("cameraStatus").textContent = message;
}

function updateStartButtons() {
    $("start1").disabled =
        cameraRunning || busy || !!barcode1Value;

    $("start2").disabled =
        cameraRunning || busy || !barcode1Value || !!barcode2Value;

    $("capture").disabled =
        !cameraRunning || busy || scanEnabled;

    $("cancel").disabled =
        !cameraRunning && !busy;
}

async function openCamera(barcodeNumber) {
    if (cameraRunning || busy) return;

    if (typeof Html5Qrcode === "undefined") {
        alert(
            "The scanning library could not load. " +
            "Check your internet connection and reload the page."
        );
        return;
    }

    activeBarcode = barcodeNumber;
    scanEnabled = false;

    $("result").style.display = "none";

    setCameraStatus("Starting camera. Please wait...");
    updateStartButtons();

    if (!scanner) {
        scanner = new Html5Qrcode("reader", {
            formatsToSupport: [
                Html5QrcodeSupportedFormats.CODE_128
            ],
            verbose: false
        });
    }

    try {
        await scanner.start(
            { facingMode: "environment" },
            {
                fps: 15,

                videoConstraints: {
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },

                disableFlip: true,

                qrbox: function(width, height) {
                    return {
                        width: Math.max(
                            100,
                            Math.min(500, Math.floor(width * 0.95))
                        ),
                        height: Math.max(
                            40,
                            Math.min(
                                120,
                                Math.floor(height * 0.60)
                            )
                        )
                    };
                }
            },
            onBarcodeDetected,
            function() {
                // Ignore frames where no barcode is detected.
            }
        );

        cameraRunning = true;
        scanEnabled = false;

        setCameraStatus(
            "Camera ready. Position the full barcode in the guide, " +
            "then press Capture Barcode."
        );

        updateStartButtons();

    } catch (error) {
        console.error("Unable to start camera:", error);

        cameraRunning = false;
        scanEnabled = false;

        setCameraStatus(
            "Could not start camera. Check camera permissions and HTTPS."
        );

        updateStartButtons();

        alert(
            "Unable to start the camera. Check your camera permissions " +
            "and make sure the page uses HTTPS."
        );
    }
}

/*
 * Barcode detections are ignored until Capture Barcode is pressed.
 * Only the first valid detection after pressing the button is accepted.
 */
async function onBarcodeDetected(decodedText) {
    if (!scanEnabled || busy || !cameraRunning) {
        return;
    }

    const capturedValue = String(decodedText).trim();

    if (!capturedValue) {
        return;
    }

    busy = true;
    scanEnabled = false;

    setCameraStatus("Barcode captured. Stopping camera...");
    updateStartButtons();

    try {
        await stopCamera();

        if (activeBarcode === 1) {
            barcode1Value = capturedValue;

            $("barcode1").textContent = barcode1Value;
            $("status1").textContent = "Barcode captured";
            $("status1").style.color = "green";

            setCameraStatus(
                "First barcode captured. Open the camera for the second barcode."
            );

        } else if (activeBarcode === 2) {
            barcode2Value = capturedValue;

            $("barcode2").textContent = barcode2Value;
            $("status2").textContent = "Barcode captured";
            $("status2").style.color = "green";

            compareBarcodes();
        }

    } catch (error) {
        console.error("Error processing barcode:", error);

        setCameraStatus(
            "Problem processing the barcode. Please try again."
        );

    } finally {
        busy = false;
        updateStartButtons();
    }
}

async function stopCamera() {
    scanEnabled = false;

    if (scanner && cameraRunning) {
        try {
            await scanner.stop();
        } catch (error) {
            console.warn("Camera stop message:", error);
        }
    }

    cameraRunning = false;

    if (scanner) {
        try {
            scanner.clear();
        } catch (error) {
            console.warn("Scanner clear message:", error);
        }
    }

    updateStartButtons();
}

function compareBarcodes() {
    const result = $("result");

    result.className = "";

    if (barcode1Value === barcode2Value) {
        result.classList.add("match");

        $("resultHeading").textContent = "MATCH";
        $("resultText").textContent =
            "Both barcodes are identical. Verification successful.";

    } else {
        result.classList.add("no-match");

        $("resultHeading").textContent = "NO MATCH";
        $("resultText").textContent =
            "The two barcodes are different. Please check the items.";
    }

    result.style.display = "block";
    setCameraStatus("Verification complete.");
}

$("start1").addEventListener("click", function() {
    openCamera(1);
});

$("start2").addEventListener("click", function() {
    openCamera(2);
});

/* Only this button enables barcode acceptance. */
$("capture").addEventListener("click", function() {
    if (!cameraRunning || busy || scanEnabled) {
        return;
    }

    scanEnabled = true;
    $("capture").disabled = true;

    setCameraStatus(
        "Capture enabled. Hold the full Code 128 barcode steady in the guide."
    );
});

$("cancel").addEventListener("click", async function() {
    if (busy && !cameraRunning) return;

    busy = true;
    scanEnabled = false;

    setCameraStatus("Cancelling scan...");
    updateStartButtons();

    try {
        await stopCamera();
    } finally {
        busy = false;

        setCameraStatus(
            "Scan cancelled. Press an Open Camera button to try again."
        );

        updateStartButtons();
    }
});

$("reset").addEventListener("click", async function() {
    if (busy) return;

    busy = true;
    scanEnabled = false;
    updateStartButtons();

    try {
        await stopCamera();

        barcode1Value = "";
        barcode2Value = "";
        activeBarcode = 0;

        $("barcode1").textContent = "Waiting for first barcode";
        $("barcode2").textContent = "Waiting for second barcode";

        $("status1").textContent = "Not scanned";
        $("status2").textContent = "Not scanned";

        $("status1").style.color = "";
        $("status2").style.color = "";

        $("result").style.display = "none";

        setCameraStatus(
            "Open the camera, then press Capture Barcode when ready."
        );

    } finally {
        busy = false;
        updateStartButtons();
    }
});

updateStartButtons();
</script>

</body>
</html>
